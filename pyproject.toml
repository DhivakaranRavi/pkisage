[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkisage"
version = "0.1.0"
description = "CA-agnostic PKI preflight, diagnosis and migration tool"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Security :: Cryptography"]
dependencies = ["typer>=0.12", "rich>=13", "cryptography>=42", "pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
pkisage = "pkisage.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pkisage"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["BLE001"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
