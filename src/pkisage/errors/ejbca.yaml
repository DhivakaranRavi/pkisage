# Illustrative patterns; verify against your CA's real messages before relying on them.
- id: ejbca-san-missing
  pattern: "(?i)subject alternative name.*(missing|required)|no SAN"
  category: SAN_MISSING
  cause: The request has no subjectAltName extension but the profile requires one.
  fix: Regenerate the CSR with a SAN, e.g. openssl req -new -key k.pem -addext "subjectAltName=DNS:host.example.com".
- id: ejbca-key-weak
  pattern: "(?i)key (length|size).*(too (short|small)|not allowed|minimum)|weak key"
  category: KEY_TOO_WEAK
  cause: The public key is smaller than the profile minimum.
  fix: Generate a larger key (RSA 3072+ or EC P-256/P-384) and a new CSR.
- id: ejbca-eku
  pattern: "(?i)extended key usage.*(not allowed|invalid)|EKU"
  category: EKU_NOT_ALLOWED
  cause: The requested extended key usage is not permitted by the certificate profile.
  fix: Remove the disallowed EKU from the request or use a profile that permits it.
- id: ejbca-validity
  pattern: "(?i)validity.*(exceed|too long|maximum)"
  category: VALIDITY_TOO_LONG
  cause: Requested validity exceeds the profile maximum.
  fix: Request a shorter validity period.
- id: ejbca-sigalg
  pattern: "(?i)signature algorithm.*(not (allowed|supported)|rejected)|sha-?1"
  category: SIG_ALG_REJECTED
  cause: The CSR is signed with an algorithm the profile rejects.
  fix: Re-sign the CSR with SHA-256 or stronger (openssl req -new -sha256 ...).
- id: ejbca-auth
  pattern: "(?i)(authorization|authentication) (failed|denied)|not authorized|403"
  category: AUTH_FAILED
  cause: The client credential or role lacks access to the profile or CA.
  fix: Check the client certificate / API token and role access rules.

# Verified against EJBCA Community Edition container keyfactor/ejbca-ce:latest (image 45aad12c3009, 2026-10-14)
# using `ejbca.sh ra addendentity` / `ejbca.sh createcert`. Messages are from the EJBCA CLI.
- id: ejbca-wrong-credentials
  pattern: "Wrong username or password"
  category: AUTH_FAILED
  cause: The end entity's enrollment password does not match (or the user is unknown to the CA).
  fix: Use the enrollment password set for the end entity, or reset it in the RA.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
- id: ejbca-user-not-found
  pattern: "Could not find username, and hence no CA for user"
  category: AUTH_FAILED
  cause: The end entity does not exist in the CA database.
  fix: Create the end entity first (ra addendentity or the RA web) or correct the username.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
- id: ejbca-status-not-new
  pattern: "Got request with status \\w+ \\(\\d+\\)\\. Status NEW, FAILED or INPROCESS required"
  category: UNKNOWN
  cause: The end entity already received a certificate (status GENERATED), so a new request is refused.
  fix: Set the end entity status back to NEW (or enable "allow multiple requests") before re-enrolling.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
- id: ejbca-not-pkcs10
  pattern: "is not a PKCS#10 request"
  category: UNKNOWN
  cause: The submitted file is not a valid PKCS#10 certificate request.
  fix: Regenerate the CSR (openssl req -new ...) and submit the PEM file.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
- id: ejbca-unknown-ca
  pattern: "Could not find CA '[^']+' in database"
  category: UNKNOWN
  cause: The named CA does not exist or the caller cannot see it.
  fix: Check the CA name (ca listcas) and the caller's CA access rules.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
- id: ejbca-duplicate-user
  pattern: "User '[^']+' already exists in the database"
  category: UNKNOWN
  cause: An end entity with this username already exists.
  fix: Use a different username or edit the existing end entity.
  verified_against: "ejbca-ce:latest@sha256:45aad12c3009 (2026-10-14)"
