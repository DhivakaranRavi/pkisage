name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[api]' pytest ruff mypy types-PyYAML httpx bandit pip-audit
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: bandit -q -r src -ll
      - run: pip-audit
