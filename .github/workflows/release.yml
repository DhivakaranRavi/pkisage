# The build, `twine check` and CycloneDX steps were run locally; the publish and Sigstore steps
# are UNTESTED (they need a PyPI trusted publisher and a tag). Try a TestPyPI release first.
# Configure the PyPI "trusted publisher" for this repository before the first tag.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build cyclonedx-bom && python -m build
      - run: pip install . && cyclonedx-py environment -o sbom.cdx.json
      - uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.cdx.json
